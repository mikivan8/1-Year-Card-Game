<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Truth or Dare</title>
<style>
  :root{
    --panel:#f4d9dd; --panel-2:#e9c4cb; --ink:#7d2f2a; --ink-soft:#b06a64;
    --truth:#3b7ea1; --truth-dk:#2d6180; --dare:#c75c52; --dare-dk:#a8443b;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{margin:0;min-height:100vh;padding:20px 14px 36px;display:flex;flex-direction:column;align-items:center;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:var(--ink);
    background:linear-gradient(180deg,#fbeef0,#f4d9dd);}
  h1{font-size:24px;margin:2px 0 2px;text-align:center;}
  .sub{color:var(--ink-soft);font-size:13px;margin-bottom:16px;text-align:center;}

  .modes{display:flex;gap:8px;margin-bottom:20px;}
  .mode{padding:9px 16px;border-radius:999px;border:2px solid var(--panel-2);background:#fff;color:var(--ink-soft);
    font-weight:800;font-size:14px;cursor:pointer;}
  .mode.active{background:var(--ink);color:#fff;border-color:var(--ink);}

  /* flip card */
  .card-wrap{width:100%;max-width:380px;height:300px;perspective:1200px;margin-bottom:22px;}
  .card{position:relative;width:100%;height:100%;transition:transform .5s cubic-bezier(.3,.7,.3,1);
    transform-style:preserve-3d;}
  .card.flip{transform:rotateY(180deg);}
  .face{position:absolute;inset:0;backface-visibility:hidden;border-radius:22px;padding:26px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
    box-shadow:0 14px 34px rgba(0,0,0,.18);border:3px solid rgba(255,255,255,.7);}
  .front{background:linear-gradient(160deg,#fff,#ffe9ec);}
  .front .q{font-size:60px;}
  .front .hint{margin-top:10px;color:var(--ink-soft);font-weight:700;font-size:14px;}
  .back{transform:rotateY(180deg);color:#fff;}
  .back.truth{background:linear-gradient(160deg,var(--truth),var(--truth-dk));}
  .back.dare{background:linear-gradient(160deg,var(--dare),var(--dare-dk));}
  .badge{position:absolute;top:16px;left:50%;transform:translateX(-50%);
    font-size:12px;font-weight:900;letter-spacing:2px;text-transform:uppercase;
    background:rgba(255,255,255,.22);padding:5px 14px;border-radius:999px;}
  .prompt{font-size:21px;font-weight:700;line-height:1.3;}
  .num{position:absolute;bottom:14px;right:18px;font-size:11px;opacity:.75;font-weight:700;}

  .draw{font-family:inherit;font-weight:900;font-size:17px;cursor:pointer;color:#fff;
    background:var(--dare);border:3px solid var(--dare-dk);border-radius:14px;padding:14px 34px;
    box-shadow:0 6px 0 var(--dare-dk);transition:transform .05s;}
  .draw:active{transform:translateY(4px);box-shadow:0 2px 0 var(--dare-dk);}
  .count{margin-top:14px;color:var(--ink-soft);font-size:12px;}
</style>
</head>
<body>
  <h1>🎲 Truth or Dare</h1>
  <div class="sub">Pick a mode, then draw a card. Pass the phone around 😈</div>

  <div class="modes">
    <button class="mode active" data-m="both">🎲 Both</button>
    <button class="mode" data-m="truth">💬 Truth</button>
    <button class="mode" data-m="dare">🔥 Dare</button>
  </div>

  <div class="card-wrap">
    <div class="card" id="card">
      <div class="face front">
        <div class="q">🎴</div>
        <div class="hint">Tap “Draw a card” to start</div>
      </div>
      <div class="face back truth" id="back">
        <div class="badge" id="badge">TRUTH</div>
        <div class="prompt" id="prompt"></div>
        <div class="num" id="num"></div>
      </div>
    </div>
  </div>

  <button class="draw" id="draw">Draw a card 🎴</button>
  <div class="count" id="count"></div>

<script>
// ✏️ DUMMY DATA — edit / replace freely. 25 truths + 25 dares.
const TRUTHS = [
  "What was the exact moment you knew you liked me?",
  "What's something I do that you secretly find adorable but never told me?",
  "What's the most embarrassing thing in your search history right now?",
  "Who was your very first celebrity crush?",
  "What's a tiny secret you've never told me?",
  "What's the most childish thing you still do?",
  "What's your biggest irrational fear?",
  "What's one thing you'd change about our first date if you could?",
  "What's the most embarrassing song on your playlist?",
  "What's a little white lie you've told me?",
  "What's your most-used emoji when you text me, and why?",
  "What's the weirdest thing you've ever eaten?",
  "What's a guilty-pleasure show you'd be embarrassed to admit you love?",
  "Be honest — what's the longest you've gone without showering?",
  "What's a talent you wish you had just to impress me?",
  "What's the last thing you fibbed to me about?",
  "Who's your one allowed celebrity hall pass?",
  "What's the most money you've spent on something silly?",
  "What's your single worst habit?",
  "What's the cringiest thing you did as a teenager?",
  "What's your go-to karaoke song?",
  "What's something you were nervous to tell me when we first started dating?",
  "What's something you pretend to like but secretly don't — even something I like?",
  "If Cameo or Candy could talk, what secret would they spill about you?",
  "What's your favorite memory of us so far?",
  "What's something you've wanted to try with me but never asked?",
  "What's your biggest turn-on?",
  "What's something I do that instantly gets your attention?",
  "What's one fantasy you've never told me about?",
  "What's the most adventurous place you'd want to kiss me?",
  "Have you ever had a fantasy about someone you know?",
  "What's something you'd love to see me wear?",
  "What's one thing you'd change about our intimate life?",
  "What's the boldest thing you've ever wanted to do with me?",
  "What's your favorite part of my body?",
  "What's something you've wanted me to initiate?",
  "What's the most jealous you've ever been because of me?",
  "What's one thing you wish I did more often?",
  "What's something you've been too shy to ask me for?",
];

const DARES = [
  "Do your best impression of me.",
  "Speak in an accent until your next turn.",
  "Let me pick your profile picture for the next hour.",
  "Do your best runway walk across the room.",
  "Do 10 jumping jacks right now.",
  "Show me the last 3 photos in your camera roll.",
  "Let me draw a tiny doodle on your hand.",
  "Talk only in a whisper until your next turn.",
  "Sing the chorus of the last song you listened to.",
  "Let me restyle your hair for 5 minutes.",
  "Do your best celebrity impression.",
  "Give me a genuine compliment, then an over-the-top dramatic one.",
  "Hold a plank for 30 seconds — I'll time you.",
  "Do an interpretive dance with no music.",
  "Text the 5th person in your messages “I knew it.” — nothing else.",
  "Give me a 20-second shoulder massage.",
  "Balance a spoon on your nose for 10 seconds.",
  "Speak only in questions until your next turn.",
  "Use a baby voice for the entire next round.",
  "Read your most recent emoji row out loud and explain each one.",
  "Act like your favorite animal for 20 seconds.",
  "Give a dramatic reading of the last text you sent me.",
  "Do your best villain laugh.",
  "Recreate your reaction from our first date, right now.",
  "Let me give you one dare of my choosing.",

  "Take turns going down on each other. 60 seconds each. You go first.",
  "Eat your partner's 🍑. They tell you when to stop.",
  "Take a picture of your partner going down on you.",
  "Kiss your partner for 60 seconds without using your hands.",
  "Take off one item of clothing chosen by your partner.",
  "Let your partner blindfold you and tease you for 2 minutes.",
  "Sit on your partner's lap and maintain eye contact for 60 seconds.",
  "Whisper something you've always wanted your partner to do.",
  "Give your partner a slow, seductive dance. No touching allowed.",
  "Let your partner choose where they want your next kiss.",
  "Kiss your partner everywhere except their lips for 60 seconds.",
  "Get as close as possible without kissing for one full minute.",
  "Let your partner choose one layer of clothing to remove.",
  "Give your partner a 60-second massage.",
  "Let your partner choose one place on your body to kiss for 30 seconds.",
  "Give your partner your best attempt at making them lose their composure without speaking.",
  "Tell your partner your favorite thing about their body, then kiss it.",
  "Give your partner 60 seconds of attention focused on their chest — they tell you when to stop.",
  "Let your partner choose a song and give them your most seductive dance.",
  "Send your partner a text telling them exactly what you're thinking about them right now.",
  "Tell your partner one thing you want to happen later tonight.",
  "Make out with your partner like you haven't seen them in a year.",
  "Let your partner ask you one question that you have to answer honestly.",
  "For the next 3 minutes, your partner decides where you can kiss them.",
  "Let your partner give you a dare of their choosing."
];

let mode = "both";
let last = null;

const cardEl = document.getElementById("card");
const backEl = document.getElementById("back");
const badgeEl = document.getElementById("badge");
const promptEl = document.getElementById("prompt");
const numEl = document.getElementById("num");
const countEl = document.getElementById("count");

function pool(){
  if (mode === "truth") return TRUTHS.map((t,i)=>({type:"truth",text:t,n:i+1}));
  if (mode === "dare")  return DARES.map((t,i)=>({type:"dare",text:t,n:i+1}));
  return TRUTHS.map((t,i)=>({type:"truth",text:t,n:i+1}))
    .concat(DARES.map((t,i)=>({type:"dare",text:t,n:i+1})));
}
function updateCount(){
  const p = pool();
  countEl.textContent = p.length + " cards in play";
}
function draw(){
  const p = pool();
  let pick, guard = 0;
  do { pick = p[Math.random()*p.length|0]; guard++; }
  while (p.length > 1 && last && pick.type===last.type && pick.text===last.text && guard<20);
  last = pick;

  // flip out, swap content mid-flip, flip in
  cardEl.classList.remove("flip");
  void cardEl.offsetWidth;
  cardEl.classList.add("flip");
  setTimeout(()=>{
    backEl.className = "face back " + pick.type;
    badgeEl.textContent = pick.type === "truth" ? "💬 TRUTH" : "🔥 DARE";
    promptEl.textContent = pick.text;
    numEl.textContent = (pick.type==="truth"?"T":"D") + pick.n;
  }, 250);
}

document.querySelectorAll(".mode").forEach(b=>b.addEventListener("click",()=>{
  document.querySelectorAll(".mode").forEach(x=>x.classList.remove("active"));
  b.classList.add("active");
  mode = b.dataset.m;
  updateCount();
}));
document.getElementById("draw").addEventListener("click", draw);
updateCount();
</script>
</body>
</html>
