<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Truth or Dare</title>
<style>
  :root{
    --panel:#f4d9dd; --panel-2:#e9c4cb; --ink:#7d2f2a; --ink-soft:#b06a64;
    --truth:#3b7ea1; --truth-dk:#2d6180; --dare:#c75c52; --dare-dk:#a8443b;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{margin:0;min-height:100vh;padding:20px 14px 36px;display:flex;flex-direction:column;align-items:center;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:var(--ink);
    background:linear-gradient(180deg,#fbeef0,#f4d9dd);}
  h1{font-size:24px;margin:2px 0 2px;text-align:center;}
  .sub{color:var(--ink-soft);font-size:13px;margin-bottom:16px;text-align:center;}

  .modes{display:flex;gap:8px;margin-bottom:20px;}
  .mode{padding:9px 16px;border-radius:999px;border:2px solid var(--panel-2);background:#fff;color:var(--ink-soft);
    font-weight:800;font-size:14px;cursor:pointer;}
  .mode.active{background:var(--ink);color:#fff;border-color:var(--ink);}

  /* flip card */
  .card-wrap{width:100%;max-width:380px;height:300px;perspective:1200px;margin-bottom:22px;}
  .card{position:relative;width:100%;height:100%;transition:transform .5s cubic-bezier(.3,.7,.3,1);
    transform-style:preserve-3d;}
  .card.flip{transform:rotateY(180deg);}
  .face{position:absolute;inset:0;backface-visibility:hidden;border-radius:22px;padding:26px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
    box-shadow:0 14px 34px rgba(0,0,0,.18);border:3px solid rgba(255,255,255,.7);}
  .front{background:linear-gradient(160deg,#fff,#ffe9ec);}
  .front .q{font-size:60px;}
  .front .hint{margin-top:10px;color:var(--ink-soft);font-weight:700;font-size:14px;}
  .back{transform:rotateY(180deg);color:#fff;}
  .back.truth{background:linear-gradient(160deg,var(--truth),var(--truth-dk));}
  .back.dare{background:linear-gradient(160deg,var(--dare),var(--dare-dk));}
  .badge{position:absolute;top:16px;left:50%;transform:translateX(-50%);
    font-size:12px;font-weight:900;letter-spacing:2px;text-transform:uppercase;
    background:rgba(255,255,255,.22);padding:5px 14px;border-radius:999px;}
  .prompt{font-size:21px;font-weight:700;line-height:1.3;}
  .num{position:absolute;bottom:14px;right:18px;font-size:11px;opacity:.75;font-weight:700;}

  .draw{font-family:inherit;font-weight:900;font-size:17px;cursor:pointer;color:#fff;
    background:var(--dare);border:3px solid var(--dare-dk);border-radius:14px;padding:14px 34px;
    box-shadow:0 6px 0 var(--dare-dk);transition:transform .05s;}
  .draw:active{transform:translateY(4px);box-shadow:0 2px 0 var(--dare-dk);}
  .count{margin-top:14px;color:var(--ink-soft);font-size:12px;}
</style>
</head>
<body>
  <h1>🎲 Truth or Dare</h1>
  <div class="sub">Pick a mode, then draw a card. Pass the phone around 😈</div>

  <div class="modes">
    <button class="mode active" data-m="both">🎲 Both</button>
    <button class="mode" data-m="truth">💬 Truth</button>
    <button class="mode" data-m="dare">🔥 Dare</button>
  </div>

  <div class="card-wrap">
    <div class="card" id="card">
      <div class="face front">
        <div class="q">🎴</div>
        <div class="hint">Tap “Draw a card” to start</div>
      </div>
      <div class="face back truth" id="back">
        <div class="badge" id="badge">TRUTH</div>
        <div class="prompt" id="prompt"></div>
        <div class="num" id="num"></div>
      </div>
    </div>
  </div>

  <button class="draw" id="draw">Draw a card 🎴</button>
  <div class="count" id="count"></div>

<script>
// ✏️ DUMMY DATA — edit / replace freely. 25 truths + 25 dares.
const TRUTHS = [
  "What's the wildest thing you've ever wanted to try with me?",
  "What's something I've done that instantly turned you on?",
  "Have you ever imagined me with someone else? What was the scenario?",
  "What's one thing you want more of in our intimate life?",
  "What's your biggest secret turn-on?",
  "What's something you've wanted to ask me to do but haven't?",
  "What's the most adventurous place you'd want to fool around with me?",
  "What's one thing about my body you can't stop looking at?",
  "What's the most jealous you've ever been because of me?",
  "If we could have one completely consequence-free night together, what would you want to happen?",
  "What's a fantasy you've been too embarrassed to tell me?",
  "What's something you wish I'd initiate more often?",
  "What's the boldest thought you've ever had about me?",
  "What's something you've wanted to try with me but were afraid I'd say no to?",
  "What's one thing I do that makes it almost impossible for you to behave?",
  "If I gave you complete control over our next date night, what would you plan?",
];

const DARES = [
  "Take turns going down on each other. 60 seconds each. You go first.",
  "Eat your partner's [🍑]. They tell you when to stop.",
  "Take a picture of your partner going down on you.",
  "Take off one item of clothing chosen by your partner. No arguing.",
  "Let your partner blindfold you and tease you for 2 minutes.",
  "Make out for 2 minutes. Whoever breaks first has to remove an item of clothing.",
  "Sit on your partner's lap and whisper exactly what you want them to do later tonight.",
  "Give your partner 60 seconds to make you lose your composure without speaking.",
  "Let your partner choose where they want your next kiss.",
  "Give your partner a slow strip tease. They aren't allowed to touch you.",
  "Kiss your partner everywhere except their lips for 60 seconds.",
  "Let your partner choose one thing you're wearing that has to come off.",
  "Get as close as possible without kissing for 60 seconds. Whoever gives in first loses.",
  "Let your partner take one photo of you that you'd only want them to have.",
  "Tell your partner your most secret fantasy. They decide whether you're acting it out tonight.",
  "Your partner gets to ask for one thing they've always wanted from you. You have to seriously consider it.",
  "Spend 3 minutes trying to turn your partner on using only kisses and whispers.",
  "Choose: give your partner a 60-second tease, or let them choose your next dare.",
  "Let your partner choose an item of clothing for you to wear for the rest of the game.",
  "Sit face-to-face with your partner for 60 seconds without speaking or looking away.",
  "Let your partner decide exactly how you should kiss them for the next 60 seconds.",
  "Give your partner your most seductive dance while they aren't allowed to touch you.",
  "Tell your partner exactly what you want them to do later tonight — in their ear.",
  "Let your partner choose one thing you have to compliment about them for an entire minute.",
  "Recreate the moment you first realized you were seriously attracted to your partner.",
  "Let your partner tease your most sensitive spot for 60 seconds. You tell them when to stop."
];
  
let mode = "both";
let last = null;

const cardEl = document.getElementById("card");
const backEl = document.getElementById("back");
const badgeEl = document.getElementById("badge");
const promptEl = document.getElementById("prompt");
const numEl = document.getElementById("num");
const countEl = document.getElementById("count");

function pool(){
  if (mode === "truth") return TRUTHS.map((t,i)=>({type:"truth",text:t,n:i+1}));
  if (mode === "dare")  return DARES.map((t,i)=>({type:"dare",text:t,n:i+1}));
  return TRUTHS.map((t,i)=>({type:"truth",text:t,n:i+1}))
    .concat(DARES.map((t,i)=>({type:"dare",text:t,n:i+1})));
}
function updateCount(){
  const p = pool();
  countEl.textContent = p.length + " cards in play";
}
function draw(){
  const p = pool();
  let pick, guard = 0;
  do { pick = p[Math.random()*p.length|0]; guard++; }
  while (p.length > 1 && last && pick.type===last.type && pick.text===last.text && guard<20);
  last = pick;

  // flip out, swap content mid-flip, flip in
  cardEl.classList.remove("flip");
  void cardEl.offsetWidth;
  cardEl.classList.add("flip");
  setTimeout(()=>{
    backEl.className = "face back " + pick.type;
    badgeEl.textContent = pick.type === "truth" ? "💬 TRUTH" : "🔥 DARE";
    promptEl.textContent = pick.text;
    numEl.textContent = (pick.type==="truth"?"T":"D") + pick.n;
  }, 250);
}

document.querySelectorAll(".mode").forEach(b=>b.addEventListener("click",()=>{
  document.querySelectorAll(".mode").forEach(x=>x.classList.remove("active"));
  b.classList.add("active");
  mode = b.dataset.m;
  updateCount();
}));
document.getElementById("draw").addEventListener("click", draw);
updateCount();
</script>
</body>
</html>
